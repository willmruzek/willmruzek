summary: |
  I'm Will Mruzek, a software consultant and engineer with 13+ years of experience. I've worked with startups and established companies like Syncari, Reforge, and Intuit Credit Karma. Previously, I've held full-time engineering roles at Humble Bundle, CloudPassage, Spredfast, and Duo Security (Cisco).

